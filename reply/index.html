<!doctype html>
<html lang="en">
<head>

  <title>Reply with a thought — Inner Thought</title>
  <link rel="icon" type="image/png" href="../assets/icon.png">
  <style>
    :root{color-scheme:dark;--gold:#c9a84c;--cream:#ebe3d4;--quiet:#b3a897}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:2rem;background:radial-gradient(circle at 80% 10%,rgba(201,168,76,.14),transparent 34rem),linear-gradient(145deg,#0b0b0d,#18130f 58%,#0e0d10);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,34rem);text-align:center}
    .ring{width:10rem;height:10rem;margin:0 auto 2rem;display:grid;place-items:center;border:1px solid rgba(201,168,76,.38);border-radius:50%;box-shadow:0 0 4rem rgba(201,168,76,.08)}
    .ring img{width:7.5rem;height:7.5rem;border-radius:25%}
    .eyebrow{color:var(--gold);font-size:.8rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:.8rem 0 1rem;font-family:Georgia,serif;font-size:clamp(2.25rem,8vw,4rem);font-weight:500;line-height:1.05}
    p{margin:0 auto;color:var(--quiet);font-size:1.12rem;line-height:1.7;max-width:30rem}
    .privacy{margin-top:1rem;font-size:.92rem}
    .button{min-height:3.25rem;margin-top:2rem;display:inline-flex;align-items:center;justify-content:center;padding:.7rem 1.35rem;border-radius:999px;background:var(--gold);color:#111;font-weight:750;text-decoration:none}
    .brand{display:block;margin-top:2.4rem;color:var(--quiet);font-size:.8rem;letter-spacing:.08em;text-decoration:none}
    .button:focus-visible,.brand:focus-visible{outline:3px solid var(--cream);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="ring" aria-hidden="true"><img src="../assets/icon.png" alt=""></div>
    <div class="eyebrow" data-copy="eyebrow">A thought led you here</div>
    <h1 data-copy="title">What did it spark in you?</h1>
    <p data-copy="body">Inner Thought gives your reply somewhere private to land. It is not sent back to the person who shared the card.</p>
    <p class="privacy" data-copy="privacy">No account. No social feed. You decide what leaves your device.</p>
    <a class="button" href="https://apps.apple.com/app/id6794169203" data-copy="button">Get Inner Thought on the App Store</a>
    <a class="brand" href="https://inner-thought.movingtruth.com" data-copy="brand">INNER THOUGHT · BY MOVING TRUTH</a>
  </main>
  <script>
    const copy={
      fr:["Une pensée vous a conduit ici","Qu’a-t-elle éveillé en vous ?","Inner Thought offre à votre réponse un endroit privé où se poser. Elle n’est pas renvoyée à la personne qui a partagé la carte.","Aucun compte. Aucun fil social. Vous décidez de ce qui quitte votre appareil.","Télécharger Inner Thought sur l’App Store","INNER THOUGHT · PAR MOVING TRUTH"],
      es:["Un pensamiento te trajo hasta aquí","¿Qué despertó en ti?","Inner Thought ofrece a tu respuesta un lugar privado donde quedarse. No se envía a quien compartió la tarjeta.","Sin cuenta. Sin red social. Tú decides qué sale de tu dispositivo.","Descargar Inner Thought en el App Store","INNER THOUGHT · POR MOVING TRUTH"],
      de:["Ein Gedanke hat dich hierhergeführt","Was hat er in dir ausgelöst?","Inner Thought gibt deiner Antwort einen privaten Ort. Sie wird nicht an die Person zurückgesendet, die die Karte geteilt hat.","Kein Konto. Kein sozialer Feed. Du entscheidest, was dein Gerät verlässt.","Inner Thought im App Store laden","INNER THOUGHT · VON MOVING TRUTH"],
      "pt-BR":["Um pensamento trouxe você até aqui","O que ele despertou em você?","Inner Thought oferece à sua resposta um lugar privado para ficar. Ela não é enviada de volta a quem compartilhou o cartão.","Sem conta. Sem feed social. Você decide o que sai do seu dispositivo.","Baixar Inner Thought na App Store","INNER THOUGHT · POR MOVING TRUTH"],
      it:["Un pensiero ti ha condotto qui","Che cosa ha suscitato in te?","Inner Thought offre alla tua risposta un luogo privato in cui posarsi. Non viene inviata a chi ha condiviso la carta.","Nessun account. Nessun feed sociale. Decidi tu cosa lascia il dispositivo.","Scarica Inner Thought dall’App Store","INNER THOUGHT · DI MOVING TRUTH"],
      nl:["Een gedachte bracht je hier","Wat bracht die in jou teweeg?","Inner Thought geeft je antwoord een persoonlijke plek. Het wordt niet teruggestuurd naar degene die de kaart deelde.","Geen account. Geen sociale feed. Jij bepaalt wat je apparaat verlaat.","Download Inner Thought in de App Store","INNER THOUGHT · VAN MOVING TRUTH"],
      hi:["एक विचार आपको यहाँ लाया","इसने आपके भीतर क्या जगाया?","Inner Thought आपके उत्तर को सुरक्षित और निजी जगह देता है। कार्ड साझा करने वाले व्यक्ति को यह वापस नहीं भेजा जाता।","कोई खाता नहीं। कोई सोशल फ़ीड नहीं। आपके डिवाइस से क्या बाहर जाए, यह आप तय करते हैं।","App Store से Inner Thought पाएँ","INNER THOUGHT · MOVING TRUTH द्वारा"],
      ar:["قادك خاطر إلى هنا","ماذا أيقظ في داخلك؟","يمنح Inner Thought ردك مكانًا خاصًا ليستقر فيه. ولن يُرسل إلى الشخص الذي شارك البطاقة.","بلا حساب. بلا موجز اجتماعي. أنت تقرر ما يغادر جهازك.","تنزيل Inner Thought من App Store","INNER THOUGHT · من MOVING TRUTH"],
      "zh-Hans":["一个想法把你带到这里","它在你心中激起了什么？","Inner Thought 为你的回应提供一个私密的落脚处。它不会发回给分享卡片的人。","无需账户。没有社交动态。由你决定什么可以离开设备。","在 App Store 获取 Inner Thought","INNER THOUGHT · MOVING TRUTH 出品"],
      ja:["ひとつの思いが、ここへ導きました","あなたの中に何が生まれましたか？","Inner Thought は、あなたの返事が静かに残るためのプライベートな場所です。カードを共有した人に返事が送られることはありません。","アカウントなし。ソーシャルフィードなし。端末の外に出すものは、あなたが決めます。","App StoreでInner Thoughtを入手","INNER THOUGHT · MOVING TRUTH"],
      ko:["한 생각이 당신을 이곳으로 이끌었습니다","당신 안에 무엇이 떠올랐나요?","Inner Thought는 당신의 답을 비공개로 간직할 곳을 제공합니다. 카드를 공유한 사람에게 답이 전송되지는 않습니다.","계정도, 소셜 피드도 없습니다. 기기 밖으로 무엇을 보낼지는 당신이 결정합니다.","App Store에서 Inner Thought 받기","INNER THOUGHT · MOVING TRUTH"],
      ru:["Одна мысль привела вас сюда","Что она пробудила в вас?","Inner Thought даёт вашему ответу приватное место. Он не отправляется человеку, который поделился карточкой.","Без аккаунта. Без социальной ленты. Только вы решаете, что покидает устройство.","Загрузить Inner Thought в App Store","INNER THOUGHT · ОТ MOVING TRUTH"],
      th:["ความคิดหนึ่งพาคุณมาที่นี่","มันจุดประกายอะไรในตัวคุณ?","Inner Thought มอบพื้นที่ส่วนตัวให้คำตอบของคุณ และจะไม่ส่งกลับไปยังผู้ที่แชร์การ์ด","ไม่มีบัญชี ไม่มีฟีดโซเชียล คุณเป็นผู้ตัดสินใจว่าสิ่งใดจะออกจากอุปกรณ์","ดาวน์โหลด Inner Thought บน App Store","INNER THOUGHT · โดย MOVING TRUTH"]
    };
    const requested=(navigator.languages||[navigator.language||"en"]).map(value=>value.toLowerCase());
    const key=Object.keys(copy).find(locale=>requested.some(value=>value===locale.toLowerCase()||value.startsWith(locale.toLowerCase()+"-")));
    if(key){document.documentElement.lang=key;document.documentElement.dir=key==="ar"?"rtl":"ltr";document.querySelectorAll("[data-copy]").forEach((node,index)=>node.textContent=copy[key][index]);}
  </script>
</body>
</html>
